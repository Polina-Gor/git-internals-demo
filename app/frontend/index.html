<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mood Switcher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.6s ease;
            background: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        p#mood-text { font-size: 1.2rem; opacity: 0.9; margin-bottom: 30px; min-height: 1.5em; }
        button {
            padding: 14px 36px;
            font-size: 1.1rem;
            border: 2px solid #fff;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.3s, transform 0.15s;
        }
        button:hover { background: rgba(255,255,255,0.3); }
        button:active { transform: scale(0.96); }
        #counter { margin-top: 20px; font-size: 0.9rem; opacity: 0.7; }
    </style>
</head>
<body>
    <h1>Mood Switcher</h1>
    <p id="mood-text">Нажми кнопку, чтобы узнать настроение</p>
    <button onclick="changeMood()">Сменить настроение</button>
    <div id="counter">Переключений: 0</div>

    <script>
        let count = 0;
        async function changeMood() {
            const btn = document.querySelector("button");
            btn.disabled = true;
            try {
                const res = await fetch("/api/mood");
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                document.body.style.background = data.color;
                document.getElementById("mood-text").textContent = data.text + "  (" + data.mood + ")";
                count++;
                document.getElementById("counter").textContent = "Переключений: " + count;
            } catch (e) {
                document.getElementById("mood-text").textContent = "Ошибка: " + e.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
